name: Build

on:
  push:
  pull_request:

jobs:
  build_container:
    name: Build container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VERSION=edge
            GITHASH=${{ github.sha }}
