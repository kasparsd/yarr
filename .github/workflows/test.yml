name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: make docker-dev CMD='make build'

      - name: Test
        run: make docker-dev CMD='make test'
